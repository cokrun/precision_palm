runtime: python311
instance_class: F2
entrypoint: gunicorn -b :$PORT app:app --workers 3 --threads 4 --timeout 120

env_variables:
  FLASK_ENV: "production"
  GOOGLE_CLOUD_PROJECT: "palm-project-511008"
