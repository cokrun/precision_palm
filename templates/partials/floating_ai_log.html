<!-- templates/partials/floating_ai_log.html -->
<script src="/static/js/global_ai_triggers.js"></script>

<!-- Floating AI Live Telemetry Widget (Default: 'Ai', Hover: 'Ai Live Logs') -->
<div id="floatingAiWidget" class="fixed bottom-4 sm:bottom-5 right-4 sm:right-5 z-40 flex items-center font-mono">
    <button type="button" onclick="toggleFloatingAiModal()" class="pp-ai-live-btn group" title="Ai Live Logs &amp; Telemetry Stream">
        <span class="pp-ai-pulse-dot"></span>
        <span class="pp-ai-short-text">Ai</span>
        <span class="pp-ai-expand-text">Live Logs</span>
    </button>
</div>

<!-- Modal Quick View Telemetri AI -->
<div id="quickAiModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-3 sm:p-6 hidden">
    <div class="bg-slate-900 border border-emerald-500/50 rounded-3xl max-w-2xl w-full flex flex-col shadow-2xl overflow-hidden font-mono text-xs">
        <div class="p-4 border-b border-slate-800 bg-slate-950 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="text-base">⚡</span>
                <span class="font-bold text-white">Google Cloud AI Live Execution Stream</span>
            </div>
            <button type="button" onclick="toggleFloatingAiModal()" class="text-slate-400 hover:text-white p-1 cursor-pointer">✕</button>
        </div>
        <div class="p-4 space-y-2 max-h-80 overflow-y-auto" id="quickAiLogContainer">
            <p class="text-slate-400 text-center py-4" data-i18n="ai_log_loading">Loading transaction logs...</p>
        </div>
        <div class="p-3 border-t border-slate-800 bg-slate-950 flex items-center justify-between">
            <a href="/ai-logs" class="text-cyan-400 hover:underline font-bold text-[11px] flex items-center gap-1">
                <span>📑</span> <span data-i18n="ai_log_open_full">Open Full Audit Page &rarr;</span>
            </a>
            <button type="button" onclick="toggleFloatingAiModal()" class="px-3 py-1 rounded-xl bg-slate-800 text-slate-300 font-bold cursor-pointer" data-i18n="btn_close">
                Close
            </button>
        </div>
    </div>
</div>

<script>
    async function toggleFloatingAiModal() {
        const modal = document.getElementById('quickAiModal');
        if (!modal) return;
        const isHidden = modal.classList.contains('hidden');
        if (isHidden) {
            modal.classList.remove('hidden');
            await loadQuickLogs();
        } else {
            modal.classList.add('hidden');
        }
    }

    async function loadQuickLogs() {
        const container = document.getElementById('quickAiLogContainer');
        if (!container) return;
        const isId = (localStorage.getItem('precision_palm_lang') || 'en') === 'id';
        try {
            const res = await fetch('/api/ai/logs?limit=5');
            const data = await res.json();
            if (data.success && data.logs && data.logs.length > 0) {
                container.innerHTML = data.logs.map(l => `
                    <div class="p-2.5 rounded-xl bg-slate-950 border border-slate-800 flex items-center justify-between gap-2">
                        <div>
                            <strong class="text-white block text-[11px]">${l.feature_name}</strong>
                            <span class="text-slate-500 text-[10px]">${l.timestamp} &bull; ${l.model_engine}</span>
                        </div>
                        <div class="text-right">
                            <span class="text-emerald-400 font-bold block text-[11px]">${l.latency_ms} ms</span>
                            <span class="text-[9px] text-slate-400">${l.status}</span>
                        </div>
                    </div>
                `).join('');
            } else {
                container.innerHTML = `<p class="text-slate-400 text-center py-4">${isId ? 'Belum ada transaksi AI tercatat.' : 'No AI transactions recorded yet.'}</p>`;
            }
        } catch (_) {
            container.innerHTML = `<p class="text-rose-400 text-center py-4">${isId ? 'Gagal memuat log.' : 'Failed to load logs.'}</p>`;
        }
    }
</script>
